project:
  name: research-project
  type: internal
  research_question: "Define a scoped, falsifiable research question."
  owner: unassigned

data_policy:
  raw_data_to_model: false
  allow_schema_metadata: true
  allow_aggregates: true
  allow_samples: false
  allow_sensitive_values: false
  public_release_allowed: false
  approved_models: []

databricks:
  enabled: false
  allowed_catalogs: []
  allowed_schemas: []
  warehouse: ""
  row_access: false
  approved_tables: {}
  minimum_cohort_size: 10
  sensitive_tags:
    - pii
    - sensitive
    - confidential
    - restricted
    - personal

mlflow:
  enabled: false
  allowed_experiments: []
  allowed_metadata_keys: []
  allow_artifacts: false
  allowed_artifact_paths: []

publication:
  intended: false
  candidate_venues: []
  external_release_allowed: false

research:
  current_sprint: 0
  status: discovery
